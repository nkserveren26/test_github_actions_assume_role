name: Test Assume Role

on:
  push:
    branches:
      - main

jobs:
  s3ls:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: ap-northeast-1 # リージョンを指定
          role-to-assume: ${{ secrets.ASSUME_ROLE_ARN }} # 作成した IAM ロールの ARN

      # プライベートな S3 バケットを読み取ってみる
      - run: aws s3 ls 